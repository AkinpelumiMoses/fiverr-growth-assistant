name: Build MILE live-action welcome film
on:
  push:
    branches: [main]
    paths-ignore:
      - "public/media/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mile-film-build
  cancel-in-progress: true
jobs:
  build-film:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'yt-dlp[default]' edge-tts
      - name: Build film
        run: python scripts/build_mile_film.py
      - name: Commit generated film and captions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/mile-film.mp4 public/media/mile-film.vtt
          git commit -m "Build MILE live-action welcome film" || echo "No changes to commit"
          git push origin main
